<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f9ff;
            margin: 0;
        }

        .header {
            background: #0369a1;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .form-box {
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #ccc;
        }

        h2 {
            color: #0369a1;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #0369a1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #075985;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Event Registration</h1>
        <p>Register for your favourite campus events</p>
    </div>

    <div class="form-box">

        <h2>Event Registration Form</h2>

        <label>Student Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Student ID</label>
        <input type="text" placeholder="Enter student ID">

        <label>Email</label>
        <input type="email" placeholder="Enter email">

        <label>Select Event</label>
        <select>
            <option>Choose an event</option>
            <option>Tech Fest</option>
            <option>Coding Contest</option>
            <option>Cultural Fest</option>
            <option>Sports Meet</option>
        </select>

        <label>Department</label>
        <select>
            <option>Select Department</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>MECH</option>
        </select>

        <button>Register Now</button>

    </div>

</body>
</html>
